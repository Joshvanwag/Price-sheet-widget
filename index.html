
<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Price Sheet Sync</title>
	<script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f3f4f6;
		}

		html, body {
			width: 100%;
			min-height: 100%;
		}

		body {
			margin: 0;
			overflow-x: hidden;
		}

		.wrap {
			width: 100%;
			padding: 20px;
			min-height: 100vh;
			box-sizing: border-box;
		}

		.card {
			width: 100%;
			max-width: none;
			margin: 0;
			box-sizing: border-box;
			background: #ffffff;
			border: 1px solid #e5e7eb;
			border-radius: 16px;
			padding: 28px 32px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
		}

		.header {
			display: flex;
			justify-content: center;
			text-align: center;
			gap: 16px;
			align-items: center;
			margin-bottom: 22px;
			padding-bottom: 18px;
			border-bottom: 2px solid #e5e7eb;
		}

		h1 {
			margin: 0;
			font-size: 28px;
			color: #1e40af;
			letter-spacing: 0.02em;
		}

		p {
			margin: 0;
		}

		.hint {
			color: #6b7280;
			margin-bottom: 12px;
		}

		.message {
			padding: 12px 14px;
			border-radius: 10px;
			border: 1px solid transparent;
			margin-bottom: 16px;
		}

		.message.info {
			background: #eff6ff;
			border-color: #bfdbfe;
		}

		.message.success {
			background: #f0fdf4;
			border-color: #bbf7d0;
		}

		.message.error {
			background: #fef2f2;
			border-color: #fecaca;
		}

		.fields {
			display: block;
		}

		.field-row {
			display: grid;
			gap: 6px;
			margin-bottom: 16px;
			align-content: start;
		}

		label {
			font-weight: 700;
			font-size: 14px;
		}

		select {
			width: 100%;
			box-sizing: border-box;
			padding: 11px 36px 11px 13px;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			font: inherit;
			font-size: 14px;
			background-color: #ffffff;
			appearance: none;
			-webkit-appearance: none;
			background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 20 20' fill='none'><path d='M5.5 7.5L10 12L14.5 7.5' stroke='%236B7280' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
			background-repeat: no-repeat;
			background-position: right 10px center;
			background-size: 20px 20px;
			cursor: pointer;
			transition: border-color 0.15s ease, box-shadow 0.15s ease;
		}

		select:hover:not(:disabled) {
			border-color: #a5b4fc;
		}

		select:focus {
			outline: none;
			border-color: #60a5fa;
			box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.22);
		}

		select:disabled {
			background-color: #f3f4f6;
			color: #6b7280;
			cursor: not-allowed;
		}

		/* --- Custom single-value picklist (native <select> can't be styled
		   inside its dropdown popup, so this replaces it entirely) --- */
		.single-picklist {
			position: relative;
			width: 100%;
			min-width: 0;
			font-size: 14px;
		}

		.single-picklist-value-line {
			min-height: 42px;
			width: 100%;
			display: flex;
			align-items: center;
			box-sizing: border-box;
			padding: 10px 38px 10px 13px;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			background: #ffffff;
			cursor: pointer;
			position: relative;
			transition: border-color 0.15s ease, box-shadow 0.15s ease;
		}

		.single-picklist:not(.disabled) .single-picklist-value-line:hover {
			border-color: #93c5fd;
		}

		.single-picklist.open .single-picklist-value-line,
		.single-picklist:focus .single-picklist-value-line {
			outline: none;
			border-color: #60a5fa;
			box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
		}

		.single-picklist.disabled .single-picklist-value-line {
			background: #f3f4f6;
			color: #6b7280;
			cursor: not-allowed;
		}

		.single-picklist-display {
			min-width: 0;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			color: #1f2937;
		}

		.single-picklist-display.placeholder {
			color: #9ca3af;
		}

		.single-picklist-caret {
			position: absolute;
			right: 13px;
			top: 50%;
			width: 8px;
			height: 8px;
			border-right: 2px solid #6b7280;
			border-bottom: 2px solid #6b7280;
			transform: translateY(-65%) rotate(45deg);
			transition: transform 0.15s ease;
		}

		.single-picklist.open .single-picklist-caret {
			transform: translateY(-25%) rotate(225deg);
		}

		.single-picklist-menu {
			position: absolute;
			z-index: 100;
			top: calc(100% + 5px);
			left: 0;
			right: 0;
			max-height: 240px;
			overflow-y: auto;
			padding: 5px;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
		}

		.single-picklist-option {
			display: block;
			width: 100%;
			padding: 9px 10px;
			border: 0;
			border-radius: 6px;
			background: transparent;
			color: #1f2937;
			text-align: left;
			font-weight: 400;
			font-size: 14px;
			cursor: pointer;
		}

		.single-picklist-option:hover:not(:disabled) {
			background: #eff6ff;
			color: #1e3a8a;
		}

		.single-picklist-option.selected {
			background: #dbeafe;
			color: #1e40af;
			font-weight: 600;
		}

		.actions {
			display: flex;
			justify-content: flex-end;
			gap: 10px;
			margin-top: 24px;
		}

		button {
			border: 0;
			border-radius: 9px;
			padding: 11px 18px;
			font-weight: 700;
			font-size: 14px;
			cursor: pointer;
			background: #2563eb;
			color: white;
			transition: background 0.15s ease, transform 0.05s ease;
		}

		button:hover:not(:disabled) {
			background: #1d4ed8;
		}

		button:active:not(:disabled) {
			transform: translateY(1px);
		}

		button:disabled {
			cursor: not-allowed;
			opacity: 0.55;
		}

		.hidden {
			display: none;
		}
	</style>
</head>
<body>

	<main class="wrap">
		<section class="card">
			<div class="header">
				<div>
					<h1>Price Sheet Sync</h1>
				</div>
			</div>

			<!-- Step 1: Prompts, shown before the function is ever called -->
			<div id="promptScreen" class="hidden">
				<div class="fields">
					<div class="field-row">
						<label>SLA Pick List</label>
						<div id="slaPicklist" class="single-picklist" data-value="" tabindex="0">
							<div class="single-picklist-value-line">
								<span class="single-picklist-display placeholder">-- Select an SLA tier --</span>
								<span class="single-picklist-caret"></span>
							</div>
							<div class="single-picklist-menu hidden"></div>
						</div>
					</div>

					<!-- Only shown on Edit, hidden entirely on Create -->
					<div id="costPricePrompt" class="field-row hidden">
						<label>Update</label>
						<div id="updateModePicklist" class="single-picklist" data-value="cost_and_price" tabindex="0">
							<div class="single-picklist-value-line">
								<span class="single-picklist-display">Update cost &amp; sell price</span>
								<span class="single-picklist-caret"></span>
							</div>
							<div class="single-picklist-menu hidden"></div>
						</div>
					</div>
				</div>

				<div class="actions">
					<button id="submitPromptsBtn" type="button">Continue</button>
				</div>
			</div>

			<!-- Step 2: Loading / result, shown after Continue is clicked -->
			<div id="loading" class="message info hidden">Syncing to CRM and attaching PDF...</div>
			<div id="promptArea" class="message success hidden"></div>
			<div id="errorArea" class="message error hidden"></div>
		</section>
	</main>

	<script>
		var priceSheetID = null;
		var isEdit = false;

		// Hourly rate and SLA percentages - mirrors the server-side function.
		// Server recomputes the real dollar figure at sync time; these are
		// just for the live preview shown to the user in the picklist.
		var HOURLY_RATE = 125;
		var SLA_RATES = {
			"Bronze": 0.08,
			"Silver": 0.10,
			"Gold": 0.12,
			"Platinum": 0.14
		};

		// --- Minimal custom single-picklist controller ---
		// Native <select> can't be styled inside its own dropdown popup, so
		// this builds a fully-styleable equivalent: a clickable value line
		// plus an absolutely-positioned menu of button options.
		function initSinglePicklist(containerEl, options, onSelect) {
			var valueLine = containerEl.querySelector(".single-picklist-value-line");
			var display = containerEl.querySelector(".single-picklist-display");
			var menu = containerEl.querySelector(".single-picklist-menu");

			function renderOptions() {
				menu.innerHTML = "";
				options.forEach(function (opt) {
					var btn = document.createElement("button");
					btn.type = "button";
					btn.className = "single-picklist-option";
					btn.textContent = opt.label;
					if (containerEl.dataset.value === opt.value) {
						btn.classList.add("selected");
					}
					btn.addEventListener("click", function (e) {
						e.stopPropagation();
						containerEl.dataset.value = opt.value;
						display.textContent = opt.label;
						display.classList.remove("placeholder");
						closeMenu();
						renderOptions();
						if (onSelect) onSelect(opt.value);
					});
					menu.appendChild(btn);
				});
			}

			function openMenu() {
				menu.classList.remove("hidden");
				containerEl.classList.add("open");
			}

			function closeMenu() {
				menu.classList.add("hidden");
				containerEl.classList.remove("open");
			}

			valueLine.addEventListener("click", function (e) {
				e.stopPropagation();
				if (containerEl.classList.contains("open")) {
					closeMenu();
				} else {
					openMenu();
				}
			});

			document.addEventListener("click", function () {
				closeMenu();
			});

			renderOptions();

			return {
				setOptions: function (newOptions) {
					options = newOptions;
					renderOptions();
				}
			};
		}

		var slaPicklistEl = document.getElementById("slaPicklist");
		var updateModePicklistEl = document.getElementById("updateModePicklist");

		initSinglePicklist(updateModePicklistEl, [
			{ value: "cost_and_price", label: "Update cost & sell price" },
			{ value: "cost_only", label: "Just update cost" }
		]);

		var slaPicklistController = initSinglePicklist(slaPicklistEl, []);

		// v2 SDK has no init() method, but getQueryParams IS promise-based
		ZOHO.CREATOR.UTIL.getQueryParams().then(function (queryParams) {
			console.log("queryParams:", queryParams);
			priceSheetID = queryParams.RecordID;
			console.log("priceSheetID:", priceSheetID);

			fetchRecordAndShowPrompts();
		});

		function fetchRecordAndShowPrompts() {
			var config = {
				app_name: "application-by-chris",
				report_name: "All_Price_Sheets",
				id: priceSheetID,
				field_config: "all"
			};

			console.log("config being sent:", config);

			ZOHO.CREATOR.DATA.getRecordById(config)
				.then(function (response) {
					if (response.code === 3000 && response.data) {
						var record = response.data;

						console.log("FULL record object:", record);
						console.log("record.Total_Install_Hours raw value:", record.Total_Install_Hours, typeof record.Total_Install_Hours);

						// Total_Install_Hours already includes programming hours - use it alone
						var totalHours = parseFloat(record.Total_Install_Hours) || 0;

						isEdit = !!(record.CRM_Install_Price_Sheet_ID && record.CRM_Install_Price_Sheet_ID !== "");

						buildSLAOptions(totalHours);

						if (isEdit) {
							document.getElementById("costPricePrompt").classList.remove("hidden");
						}

						document.getElementById("promptScreen").classList.remove("hidden");
					} else {
						showError("Could not load record details.");
					}
				})
				.catch(function (err) {
					console.error(err);
					showError("Could not load record details.");
				});
		}

		function buildSLAOptions(totalHours) {
			var options = ["Bronze", "Silver", "Gold", "Platinum"].map(function (tier) {
				var amount = totalHours * HOURLY_RATE * SLA_RATES[tier];
				var formatted = "$" + amount.toFixed(2);
				return { value: tier, label: tier + " - " + formatted };
			});
			slaPicklistController.setOptions(options);
		}

		document.getElementById("submitPromptsBtn").addEventListener("click", function () {
			var slaSelection = slaPicklistEl.dataset.value || "";
			var updateMode = isEdit ? (updateModePicklistEl.dataset.value || "cost_and_price") : "";

			document.getElementById("promptScreen").classList.add("hidden");
			document.getElementById("loading").classList.remove("hidden");

			runSync(slaSelection, updateMode);
		});

		function runSync(slaSelection, updateMode) {
			var config = {
				api_name: "Sync_Price_Sheet_API",
				workspace_name: "tvspro",
				http_method: "POST",
				content_type: "application/json",
				payload: {
					priceSheetID: priceSheetID,
					slaSelection: slaSelection,
					updateMode: updateMode
				}
			};

			ZOHO.CREATOR.DATA.invokeCustomApi(config)
				.then(function (response) {
					document.getElementById("loading").classList.add("hidden");
					console.log("Sync response:", response);

					var result = response.output || response.result || response;

					if (result.crmSyncSuccess === true || result.crmSyncSuccess === "true") {
						showPrompts(result);
					} else {
						showError("CRM sync did not complete. Please check the record.");
					}
				})
				.catch(function (err) {
					document.getElementById("loading").classList.add("hidden");
					showError("Something went wrong calling the sync function.");
					console.error(err);
				});
		}

		function showPrompts(result) {
			var promptArea = document.getElementById("promptArea");
			promptArea.classList.remove("hidden");
			promptArea.innerHTML = "<p>Synced successfully. CRM ID: " + result.crmInstallPriceSheetID + "</p>";

			var recordSummaryUrl = "https://creatorapp.zoho.com/tvspro/environment/development/application-by-chris/record-summary/All_Price_Sheets/" + priceSheetID;

			setTimeout(function () {
				ZOHO.CREATOR.UTIL.navigateParentURL({
					action: "open",
					url: recordSummaryUrl,
					window: "same"
				});
			}, 1500);
		}

		function showError(msg) {
			var errorArea = document.getElementById("errorArea");
			errorArea.classList.remove("hidden");
			errorArea.innerText = msg;
		}
	</script>
</body>
</html>
